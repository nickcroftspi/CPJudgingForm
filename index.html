<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Coolest Projects Judging Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        .status-bar { position: sticky; top: 0; z-index: 10; }
        #result { min-height: 1.5rem; }
    </style>
</head>
<body class="container mt-4 mb-5">
    <h2 class="text-center">Coolest Projects Judging Form!</h2>

    <div class="status-bar bg-white py-2">
        <div id="pending_notice" class="alert alert-warning py-2 mb-0 d-none">
            <strong><span id="pending_count">0</span> score(s) still saving.</strong>
            Please keep this page open until this message disappears.
        </div>
    </div>

    <form id="judgingForm">
        <div class="mb-3">
            <label class="form-label" for="desk_no">Desk No:</label>
            <select class="form-control" name="desk_no" id="desk_no" required disabled>
                <option value="">Loading desks...</option>
            </select>
            <div id="desk_error" class="form-text text-danger d-none"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="project_name">Project Name:</label>
            <input type="text" class="form-control" name="project_name" id="project_name" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label" for="category">Category:</label>
            <input type="text" class="form-control" name="category" id="category" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label" for="team">Team:</label>
            <input type="text" class="form-control" name="team" id="team" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label" for="judge_name">Judge's Name:</label>
            <input type="text" class="form-control" name="judge_name" id="judge_name" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label" for="coolness">Coolness (1-10):</label>
            <input type="number" class="form-control" name="coolness" id="coolness" min="1" max="10" step="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="complexity">Complexity (1-10):</label>
            <input type="number" class="form-control" name="complexity" id="complexity" min="1" max="10" step="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="presentation">Presentation (1-10):</label>
            <input type="number" class="form-control" name="presentation" id="presentation" min="1" max="10" step="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="design">Design &amp; Usability (1-10):</label>
            <input type="number" class="form-control" name="design" id="design" min="1" max="10" step="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="comments">Comments:</label>
            <textarea class="form-control" name="comments" id="comments"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitButton">Submit</button>
        <div id="result" class="mt-3"></div>
    </form>

    <script>
        // Scores are posted here. Redeploy the Apps Script as a NEW VERSION of the
        // EXISTING deployment so that this URL keeps working unchanged.
        const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyfv2wLV2dZI97p9_53CZKibHgUkW1Al7cG6QTL6f2WlwSGuHvHSdOA45MPJNAezXTmsA/exec";

        // Desk data is a static file served from this same site. There is deliberately
        // no Apps Script call on page load: that endpoint returned a 404 HTML page
        // whenever two judges opened the form at once, which is what used to leave
        // the desk dropdown empty.
        const DESKS_URL = "desks.json";

        const DESK_CACHE_KEY = "cp_desks_v1";
        const QUEUE_KEY = "cp_pending_v1";
        const FIELDS = ["desk_no", "project_name", "category", "team", "judge_name",
                        "coolness", "complexity", "presentation", "design", "comments"];

        let deskData = {};
        let flushing = false;

        // ---------- pending-submission queue ----------
        // Anything a judge has submitted but the server has not yet confirmed lives
        // here, in localStorage, so it survives a reload or an accidental tab close.

        function readQueue() {
            try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
            catch (e) { return []; }
        }

        function writeQueue(queue) {
            try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); }
            catch (e) { /* private browsing: fall back to in-memory only */ }
            renderPending(queue.length);
        }

        function renderPending(count) {
            document.getElementById("pending_count").textContent = count;
            document.getElementById("pending_notice").classList.toggle("d-none", count === 0);
        }

        function newId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        }

        // ---------- sending ----------

        async function postOnce(entry) {
            const body = new FormData();
            // FormData keeps this a "simple" request, so the browser sends no CORS
            // preflight -- Apps Script does not answer OPTIONS.
            Object.keys(entry.payload).forEach(k => body.append(k, entry.payload[k]));
            body.append("submission_id", entry.id);

            const response = await fetch(SUBMIT_URL, { method: "POST", body: body });
            if (!response.ok) throw new Error("HTTP " + response.status);

            const text = await response.text();
            let data;
            try { data = JSON.parse(text); }
            catch (e) { throw new Error("Server did not return JSON"); }
            if (data.result !== "success") throw new Error(data.message || "Server reported an error");
            return data;
        }

        // Walk the queue oldest-first. Only ever remove an entry on a confirmed
        // success, so a score can never be dropped the way it used to be.
        async function flushQueue() {
            if (flushing) return;
            flushing = true;
            try {
                let delay = 2000;
                while (readQueue().length > 0) {
                    const queue = readQueue();
                    const entry = queue[0];
                    try {
                        await postOnce(entry);
                        writeQueue(readQueue().filter(item => item.id !== entry.id));
                        delay = 2000;
                    } catch (err) {
                        console.warn("Submit failed, will retry:", err.message);
                        await new Promise(r => setTimeout(r, delay));
                        delay = Math.min(delay * 2, 30000);
                    }
                }
            } finally {
                flushing = false;
            }
        }

        // ---------- desk data ----------

        function populateDesks() {
            const deskSelect = document.getElementById("desk_no");
            const keys = Object.keys(deskData);
            deskSelect.innerHTML = '<option value="">Select Desk</option>';
            keys.forEach(desk => {
                const option = document.createElement("option");
                option.value = desk;
                option.textContent = "Desk " + desk;
                deskSelect.appendChild(option);
            });
            deskSelect.disabled = false;
        }

        async function loadDeskData() {
            const cached = localStorage.getItem(DESK_CACHE_KEY);
            try {
                const response = await fetch(DESKS_URL, { cache: "no-cache" });
                if (!response.ok) throw new Error("HTTP " + response.status);
                deskData = await response.json();
                try { localStorage.setItem(DESK_CACHE_KEY, JSON.stringify(deskData)); } catch (e) {}
                populateDesks();
            } catch (err) {
                // Static file failed (offline, flaky venue wifi). Use the copy from
                // the last successful load rather than showing an empty dropdown.
                if (cached) {
                    deskData = JSON.parse(cached);
                    populateDesks();
                    document.getElementById("desk_error").textContent =
                        "Using the desk list saved on this device; could not reach the network.";
                    document.getElementById("desk_error").classList.remove("d-none");
                } else {
                    document.getElementById("desk_no").innerHTML =
                        '<option value="">Could not load desks</option>';
                    document.getElementById("desk_error").textContent =
                        "Could not load the desk list. Check your connection and reload the page.";
                    document.getElementById("desk_error").classList.remove("d-none");
                }
            }
        }

        // ---------- wiring ----------

        document.getElementById("desk_no").addEventListener("change", function () {
            const desk = deskData[this.value] || {};
            document.getElementById("project_name").value = desk.project_name || "";
            document.getElementById("category").value = desk.category || "";
            document.getElementById("team").value = desk.team || "";
            document.getElementById("judge_name").value = desk.judge_name || "";
        });

        document.getElementById("judgingForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const form = event.target;
            const submitButton = document.getElementById("submitButton");
            const result = document.getElementById("result");

            if (!form.reportValidity()) return;

            const payload = {};
            FIELDS.forEach(name => { payload[name] = form.elements[name].value; });

            const entry = { id: newId(), payload: payload, queuedAt: new Date().toISOString() };
            writeQueue(readQueue().concat([entry]));

            submitButton.disabled = true;
            submitButton.textContent = "Saving...";
            result.innerHTML = '<div class="alert alert-secondary py-2 mb-0">Saving score for desk ' +
                entry.payload.desk_no + '...</div>';

            flushQueue();

            // Give the server a fair window to confirm before letting the judge move on.
            const deadline = Date.now() + 20000;
            while (Date.now() < deadline &&
                   readQueue().some(item => item.id === entry.id)) {
                await new Promise(r => setTimeout(r, 300));
            }

            const stillPending = readQueue().some(item => item.id === entry.id);
            if (stillPending) {
                result.innerHTML = '<div class="alert alert-warning py-2 mb-0">' +
                    'Still saving in the background. You can judge the next project, but ' +
                    '<strong>keep this page open</strong> until the banner at the top clears.</div>';
            } else {
                result.innerHTML = '<div class="alert alert-success py-2 mb-0">' +
                    'Saved. Score recorded for desk ' + entry.payload.desk_no + '.</div>';
            }

            form.reset();
            ["project_name", "category", "team", "judge_name"].forEach(id => {
                document.getElementById(id).value = "";
            });
            submitButton.disabled = false;
            submitButton.textContent = "Submit";
        });

        window.addEventListener("beforeunload", function (event) {
            if (readQueue().length > 0) {
                event.preventDefault();
                event.returnValue = "";
                return "";
            }
        });

        // Retry anything left over from a previous visit, and whenever we come back online.
        window.addEventListener("online", flushQueue);

        renderPending(readQueue().length);
        loadDeskData();
        flushQueue();
    </script>
</body>
</html>
